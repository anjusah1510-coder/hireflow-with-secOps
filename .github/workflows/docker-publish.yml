name: Build Push and Deploy

on:
push:
branches:
- main

workflow_dispatch:

concurrency:
group: hireflow-main
cancel-in-progress: false

permissions:
contents: read
packages: write

env:
REGISTRY: ghcr.io
IMAGE_OWNER: anjusah1510-coder
GITOPS_REPO: anjusah1510-coder/hireflow-gitops
BACKEND_IMAGE: ghcr.io/anjusah1510-coder/hireflow-backend
FRONTEND_IMAGE: ghcr.io/anjusah1510-coder/hireflow-frontend

jobs:
docker:
name: Build and Push Images
runs-on: ubuntu-latest

```
outputs:
  build_tag: ${{ steps.image-tag.outputs.build_tag }}
  sha_tag: ${{ steps.image-tag.outputs.sha_tag }}

steps:
  - name: Checkout source repository
    uses: actions/checkout@v6

  - name: Generate image tags
    id: image-tag
    run: |
      echo "build_tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  - name: Display image tags
    run: |
      echo "Build tag: build-${{ github.run_number }}"
      echo "SHA tag: ${GITHUB_SHA}"

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v4

  - name: Log in to GitHub Container Registry
    uses: docker/login-action@v4
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Build and push backend
    uses: docker/build-push-action@v7
    with:
      context: ./backend
      file: ./backend/Dockerfile
      push: true
      tags: |
        ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}
        ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}
      cache-from: type=gha,scope=backend
      cache-to: type=gha,mode=max,scope=backend

  - name: Build and push frontend
    uses: docker/build-push-action@v7
    with:
      context: ./frontend
      file: ./frontend/Dockerfile
      push: true
      build-args: |
        VITE_API_URL=${{ vars.VITE_API_URL }}
      tags: |
        ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}
        ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}
      cache-from: type=gha,scope=frontend
      cache-to: type=gha,mode=max,scope=frontend
```

update-gitops:
name: Update GitOps Repository
needs: docker
runs-on: ubuntu-latest

```
steps:
  - name: Checkout GitOps repository
    uses: actions/checkout@v6
    with:
      repository: ${{ env.GITOPS_REPO }}
      token: ${{ secrets.GITOPS_TOKEN }}
      path: gitops
      ref: main
      fetch-depth: 0

  - name: Configure Git identity
    working-directory: gitops
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

  - name: Update backend image
    run: |
      sed -i "s|image: ghcr.io/anjusah1510-coder/hireflow-backend:.*|image: ghcr.io/anjusah1510-coder/hireflow-backend:${{ needs.docker.outputs.build_tag }}|" gitops/k8s/backend-deployment.yaml

  - name: Update frontend image
    run: |
      sed -i "s|image: ghcr.io/anjusah1510-coder/hireflow-frontend:.*|image: ghcr.io/anjusah1510-coder/hireflow-frontend:${{ needs.docker.outputs.build_tag }}|" gitops/k8s/frontend-deployment.yaml

  - name: Commit and push GitOps changes
    working-directory: gitops
    run: |
      git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml

      if git diff --cached --quiet; then
        echo "No GitOps changes detected."
        exit 0
      fi

      git commit -m "deploy: build ${{ needs.docker.outputs.build_tag }}"
      git pull --rebase origin main
      git push origin HEAD:main
```
