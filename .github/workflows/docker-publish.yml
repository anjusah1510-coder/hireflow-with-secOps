name: Build Push and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: hireflow-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: anjusah1510-coder

  GITOPS_REPO: anjusah1510-coder/hireflow-gitops

  BACKEND_IMAGE: ghcr.io/anjusah1510-coder/hireflow-backend
  FRONTEND_IMAGE: ghcr.io/anjusah1510-coder/hireflow-frontend

jobs:

  # ==========================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ==========================================================

  build-and-push:

    name: Build and Push Images

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}

    steps:

      # --------------------------------------------------------
      # CHECKOUT APPLICATION REPOSITORY
      # --------------------------------------------------------

      - name: Checkout Application Repository
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          fetch-depth: 1

      # --------------------------------------------------------
      # GENERATE IMAGE TAG
      # --------------------------------------------------------

      - name: Generate Incremental Image Tag
        id: image-tag
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "============================================"
          echo "IMAGE TAG"
          echo "============================================"
          echo "${TAG}"

      # --------------------------------------------------------
      # SETUP DOCKER BUILDX
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --------------------------------------------------------
      # LOGIN TO GHCR
      # --------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # BUILD AND PUSH BACKEND
      # --------------------------------------------------------

      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile

          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}

          cache-from: type=gha,scope=hireflow-backend
          cache-to: type=gha,mode=max,scope=hireflow-backend

      # --------------------------------------------------------
      # BUILD AND PUSH FRONTEND
      # --------------------------------------------------------

      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          push: true

          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}

          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}

          cache-from: type=gha,scope=hireflow-frontend
          cache-to: type=gha,mode=max,scope=hireflow-frontend

      # --------------------------------------------------------
      # VERIFY IMAGES
      # --------------------------------------------------------

      - name: Verify Published Images
        run: |
          echo "============================================"
          echo "IMAGES PUBLISHED SUCCESSFULLY"
          echo "============================================"

          echo ""
          echo "Backend:"
          echo "${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}"

          echo ""
          echo "Frontend:"
          echo "${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}"

          echo ""
          echo "Build Tag:"
          echo "${{ steps.image-tag.outputs.tag }}"

          echo ""
          echo "Application Commit:"
          echo "${GITHUB_SHA}"


  # ==========================================================
  # UPDATE GITOPS REPOSITORY
  # ==========================================================

  update-gitops:

    name: Update GitOps Repository

    needs: build-and-push

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------------
      # CHECK GITOPS TOKEN
      # --------------------------------------------------------

      - name: Check GitOps Token
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "${GITOPS_TOKEN}" ]; then
            echo "ERROR: GITOPS_TOKEN is not configured."
            exit 1
          fi

          echo "GITOPS_TOKEN is available."

      # --------------------------------------------------------
      # CLONE GITOPS REPOSITORY
      # --------------------------------------------------------

      - name: Checkout GitOps Repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" \
            gitops

          cd gitops

          git checkout main

          echo "============================================"
          echo "GITOPS REPOSITORY"
          echo "============================================"

          git remote -v

          echo ""

          git status

          echo ""

          git branch

      # --------------------------------------------------------
      # CONFIGURE GIT IDENTITY
      # --------------------------------------------------------

      - name: Configure Git Identity
        working-directory: gitops
        run: |
          git config user.name "hireflow-deploy-bot"
          git config user.email "hireflow-deploy-bot@users.noreply.github.com"

      # --------------------------------------------------------
      # UPDATE BACKEND IMAGE
      # --------------------------------------------------------

      - name: Update Backend Image
        run: |
          FILE="gitops/k8s/backend-deployment.yaml"

          if [ ! -f "${FILE}" ]; then
            echo "ERROR: ${FILE} not found"
            exit 1
          fi

          sed -i \
            "s|image: ghcr.io/anjusah1510-coder/hireflow-backend:.*|image: ghcr.io/anjusah1510-coder/hireflow-backend:${{ needs.build-and-push.outputs.image_tag }}|" \
            "${FILE}"

          echo "Updated backend image:"
          grep "image:" "${FILE}"

      # --------------------------------------------------------
      # UPDATE FRONTEND IMAGE
      # --------------------------------------------------------

      - name: Update Frontend Image
        run: |
          FILE="gitops/k8s/frontend-deployment.yaml"

          if [ ! -f "${FILE}" ]; then
            echo "ERROR: ${FILE} not found"
            exit 1
          fi

          sed -i \
            "s|image: ghcr.io/anjusah1510-coder/hireflow-frontend:.*|image: ghcr.io/anjusah1510-coder/hireflow-frontend:${{ needs.build-and-push.outputs.image_tag }}|" \
            "${FILE}"

          echo "Updated frontend image:"
          grep "image:" "${FILE}"

      # --------------------------------------------------------
      # SHOW GITOPS CHANGES
      # --------------------------------------------------------

      - name: Show GitOps Changes
        working-directory: gitops
        run: |
          echo "============================================"
          echo "GITOPS CHANGES"
          echo "============================================"

          git diff

      # --------------------------------------------------------
      # COMMIT GITOPS CHANGES
      # --------------------------------------------------------

      - name: Commit GitOps Changes
        id: commit
        working-directory: gitops
        run: |
          git add \
            k8s/backend-deployment.yaml \
            k8s/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "No GitOps changes detected."

            exit 0
          fi

          git commit \
            -m "deploy: ${{ needs.build-and-push.outputs.image_tag }}"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # PUSH GITOPS CHANGES
      # --------------------------------------------------------

      - name: Push GitOps Changes
        if: steps.commit.outputs.changed == 'true'
        working-directory: gitops
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |

          MAX_ATTEMPTS=5
          ATTEMPT=1

          # Explicitly configure authenticated remote
          git remote set-url origin \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git"

          while [ "${ATTEMPT}" -le "${MAX_ATTEMPTS}" ]
          do

            echo ""
            echo "============================================"
            echo "Push attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            echo "============================================"

            git fetch origin main

            git rebase origin/main

            if git push origin HEAD:main; then

              echo ""
              echo "============================================"
              echo "GITOPS UPDATE PUSHED SUCCESSFULLY"
              echo "============================================"

              exit 0

            fi

            echo "Push failed."

            ATTEMPT=$((ATTEMPT + 1))

            sleep 5

          done

          echo "ERROR: Failed to push GitOps changes."

          exit 1

      # --------------------------------------------------------
      # DEPLOYMENT SUMMARY
      # --------------------------------------------------------

      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "DEPLOYMENT PIPELINE COMPLETED"
          echo "============================================"

          echo ""

          echo "GitOps Repository:"
          echo "${{ env.GITOPS_REPO }}"

          echo ""

          echo "Image Tag:"
          echo "${{ needs.build-and-push.outputs.image_tag }}"

          echo ""

          echo "Backend:"
          echo "${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}"

          echo ""

          echo "Frontend:"
          echo "${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}"

          echo ""

          echo "Next step:"
          echo "Argo CD detects the GitOps commit and synchronizes Kubernetes."
