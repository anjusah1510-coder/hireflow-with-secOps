yaml
name: Build Push and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: hireflow-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: anjusah1510-coder
  GITOPS_REPO: anjusah1510-coder/hireflow-gitops
  BACKEND_IMAGE: ghcr.io/anjusah1510-coder/hireflow-backend
  FRONTEND_IMAGE: ghcr.io/anjusah1510-coder/hireflow-frontend

jobs:

  # ==========================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ==========================================================

  docker:
    name: Build and Push Images
    runs-on: ubuntu-latest

    outputs:
      build_tag: ${{ steps.image-tag.outputs.build_tag }}
      sha_tag: ${{ steps.image-tag.outputs.sha_tag }}

    steps:

      - name: Checkout source repository
        uses: actions/checkout@v6

      - name: Generate image tags
        id: image-tag
        run: |
          echo "build_tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Display image tags
        run: |
          echo "Build tag: build-${GITHUB_RUN_NUMBER}"
          echo "SHA tag: ${GITHUB_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # BACKEND
      # --------------------------------------------------------

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}

          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # --------------------------------------------------------
      # FRONTEND
      # --------------------------------------------------------

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true

          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}

          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}
            ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}

          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Print published images
        run: |
          echo "============================================"
          echo "IMAGES PUBLISHED"
          echo "============================================"

          echo ""
          echo "Backend:"
          echo "${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}"

          echo ""
          echo "Frontend:"
          echo "${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}"


  # ==========================================================
  # UPDATE GITOPS REPOSITORY
  # ==========================================================

  update-gitops:
    name: Update GitOps Repository
    needs: docker
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------------
      # CHECKOUT GITOPS REPOSITORY
      # --------------------------------------------------------

      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
          fetch-depth: 0
          persist-credentials: true

      # --------------------------------------------------------
      # VERIFY GITOPS REPOSITORY
      # --------------------------------------------------------

      - name: Verify GitOps repository
        working-directory: gitops
        run: |
          echo "GitOps repository:"
          git remote -v

          echo ""
          echo "Current branch:"
          git branch --show-current

          echo ""
          echo "Current commit:"
          git rev-parse HEAD

      # --------------------------------------------------------
      # CONFIGURE GIT
      # --------------------------------------------------------

      - name: Configure Git identity
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --------------------------------------------------------
      # UPDATE BACKEND IMAGE
      # --------------------------------------------------------

      - name: Update backend image
        run: |
          sed -i \
            "s|image: ghcr.io/anjusah1510-coder/hireflow-backend:.*|image: ghcr.io/anjusah1510-coder/hireflow-backend:${{ needs.docker.outputs.build_tag }}|" \
            gitops/k8s/backend-deployment.yaml

      # --------------------------------------------------------
      # UPDATE FRONTEND IMAGE
      # --------------------------------------------------------

      - name: Update frontend image
        run: |
          sed -i \
            "s|image: ghcr.io/anjusah1510-coder/hireflow-frontend:.*|image: ghcr.io/anjusah1510-coder/hireflow-frontend:${{ needs.docker.outputs.build_tag }}|" \
            gitops/k8s/frontend-deployment.yaml

      # --------------------------------------------------------
      # SHOW CHANGES
      # --------------------------------------------------------

      - name: Show GitOps changes
        working-directory: gitops
        run: |
          echo "============================================"
          echo "GITOPS CHANGES"
          echo "============================================"

          git diff

      # --------------------------------------------------------
      # COMMIT CHANGES
      # --------------------------------------------------------

      - name: Commit GitOps changes
        working-directory: gitops
        run: |
          git add \
            k8s/backend-deployment.yaml \
            k8s/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi

          git commit \
            -m "deploy: build ${{ needs.docker.outputs.build_tag }}"

      # --------------------------------------------------------
      # PUSH TO GITOPS
      # --------------------------------------------------------

      - name: Push GitOps changes
        working-directory: gitops
        run: |
          echo "Pushing GitOps changes..."

          git push origin main

      # --------------------------------------------------------
      # SUMMARY
      # --------------------------------------------------------

      - name: Deployment summary
        run: |
          echo "============================================"
          echo "GITOPS DEPLOYMENT TRIGGERED"
          echo "============================================"

          echo ""
          echo "Build tag:"
          echo "${{ needs.docker.outputs.build_tag }}"

          echo ""
          echo "Backend image:"
          echo "${{ env.BACKEND_IMAGE }}:${{ needs.docker.outputs.build_tag }}"

          echo ""
          echo "Frontend image:"
          echo "${{ env.FRONTEND_IMAGE }}:${{ needs.docker.outputs.build_tag }}"

          echo ""
          echo "GitOps repository:"
          echo "${{ env.GITOPS_REPO }}"

          echo ""
          echo "Argo CD will detect the GitOps commit."
