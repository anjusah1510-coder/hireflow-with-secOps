name: Build Push and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: hireflow-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: anjusah1510-coder
  GITOPS_REPO: anjusah1510-coder/hireflow-gitops
  BACKEND_IMAGE: ghcr.io/anjusah1510-coder/hireflow-backend
  FRONTEND_IMAGE: ghcr.io/anjusah1510-coder/hireflow-frontend

jobs:

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ============================================================

  docker:
    name: Build and Push Images
    runs-on: ubuntu-latest

    outputs:
      build_tag: ${{ steps.image-tag.outputs.build_tag }}
      sha_tag: ${{ steps.image-tag.outputs.sha_tag }}

    steps:

      # ----------------------------------------------------------
      # Checkout application repository
      # ----------------------------------------------------------

      - name: Checkout source repository
        uses: actions/checkout@v6

      # ----------------------------------------------------------
      # Generate image tags
      # ----------------------------------------------------------

      - name: Generate image tags
        id: image-tag
        run: |
          echo "build_tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Display image tags
        run: |
          echo "Build tag: build-${GITHUB_RUN_NUMBER}"
          echo "SHA tag: ${GITHUB_SHA}"

      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Build and push backend
      # ----------------------------------------------------------

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}

          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ----------------------------------------------------------
      # Build and push frontend
      # ----------------------------------------------------------

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true

          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}

          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}
            ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}

          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ----------------------------------------------------------
      # Print published images
      # ----------------------------------------------------------

      - name: Print published images
        run: |
          echo "============================================"
          echo "IMAGES PUBLISHED"
          echo "============================================"

          echo ""
          echo "Backend:"
          echo "${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}"
          echo "${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}"

          echo ""
          echo "Frontend:"
          echo "${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}"
          echo "${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}"


  # ============================================================
  # UPDATE GITOPS REPOSITORY
  # ============================================================

  update-gitops:
    name: Update GitOps Repository
    needs: docker
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Checkout GitOps repository
      # ----------------------------------------------------------

      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops
          fetch-depth: 0
          persist-credentials: true

      # ----------------------------------------------------------
      # Verify repository
      # ----------------------------------------------------------

      - name: Verify Git repository
        working-directory: gitops
        run: |
          echo "Repository:"
          git remote -v

          echo ""
          echo "Current branch:"
          git branch --show-current

          echo ""
          echo "Current commit:"
          git rev-parse HEAD

          echo ""
          echo "Testing GitHub access..."

          git ls-remote origin main

      # ----------------------------------------------------------
      # Configure Git identity
      # ----------------------------------------------------------

      - name: Configure Git identity
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ----------------------------------------------------------
      # Make sure we are on main
      # ----------------------------------------------------------

      - name: Prepare main branch
        working-directory: gitops
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      # ----------------------------------------------------------
      # Update backend image
      # ----------------------------------------------------------

      - name: Update backend image
        run: |
          sed -i \
            "s|image: ghcr.io/anjusah1510-coder/hireflow-backend:.*|image: ghcr.io/anjusah1510-coder/hireflow-backend:${{ needs.docker.outputs.build_tag }}|" \
            gitops/k8s/backend-deployment.yaml

      # ----------------------------------------------------------
      # Update frontend image
      # ----------------------------------------------------------

      - name: Update frontend image
        run: |
          sed -i \
            "s|image: ghcr.io/anjusah1510-coder/hireflow-frontend:.*|image: ghcr.io/anjusah1510-coder/hireflow-frontend:${{ needs.docker.outputs.build_tag }}|" \
            gitops/k8s/frontend-deployment.yaml

      # ----------------------------------------------------------
      # Show changes
      # ----------------------------------------------------------

      - name: Show GitOps changes
        working-directory: gitops
        run: |
          echo "============================================"
          echo "GITOPS CHANGES"
          echo "============================================"

          git diff -- k8s/backend-deployment.yaml
          git diff -- k8s/frontend-deployment.yaml

      # ----------------------------------------------------------
      # Stage changes
      # ----------------------------------------------------------

      - name: Stage GitOps changes
        working-directory: gitops
        run: |
          git add \
            k8s/backend-deployment.yaml \
            k8s/frontend-deployment.yaml

      # ----------------------------------------------------------
      # Check whether changes exist
      # ----------------------------------------------------------

      - name: Check GitOps changes
        id: changes
        working-directory: gitops
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No GitOps changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "GitOps changes detected."
          fi

      # ----------------------------------------------------------
      # Commit changes
      # ----------------------------------------------------------

      - name: Commit GitOps changes
        if: steps.changes.outputs.changed == 'true'
        working-directory: gitops
        run: |
          git commit \
            -m "deploy: build ${{ needs.docker.outputs.build_tag }}"

      # ----------------------------------------------------------
      # Push changes
      # ----------------------------------------------------------

      - name: Push GitOps changes
        if: steps.changes.outputs.changed == 'true'
        working-directory: gitops
        run: |
          echo "Pushing changes to GitOps repository..."

          git push origin main

      # ----------------------------------------------------------
      # Deployment summary
      # ----------------------------------------------------------

      - name: Deployment summary
        run: |
          echo "============================================"
          echo "GITOPS DEPLOYMENT TRIGGERED"
          echo "============================================"

          echo ""
          echo "Build tag:"
          echo "${{ needs.docker.outputs.build_tag }}"

          echo ""
          echo "Backend image:"
          echo "${{ env.BACKEND_IMAGE }}:${{ needs.docker.outputs.build_tag }}"

          echo ""
          echo "Frontend image:"
          echo "${{ env.FRONTEND_IMAGE }}:${{ needs.docker.outputs.build_tag }}"

          echo ""
          echo "GitOps repository:"
          echo "${{ env.GITOPS_REPO }}"

          echo ""
          echo "Argo CD will detect the GitOps commit."
